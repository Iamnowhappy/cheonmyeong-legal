<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>명이 오행툰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../myeongi/base.css">
</head>
<body>
<div id="root"></div>
<script src="../../myeongi/myeongi.js"></script>
<script>
const ELPAGE = {
  wood:{bubble:'시작이 너무<br>어려워요…', mood:'worry',
        desc:'새로 시작하고 쭉쭉 키워 가는 힘이<br>약하게 느껴질 수 있어요.',
        tips:['책상에 작은 화분 하나 두기','아침에 20분 걸으며 초록 보기','초록색·나무 소재 소품 쓰기'],
        color:'초록', dir:'동쪽'},
  fire:{bubble:'마음은 있는데<br>표현이 안 돼요', mood:'worry',
        desc:'열정과 표현의 기운이 약해<br>속마음이 잘 전해지지 않을 수 있어요.',
        tips:['하루 한 번, 먼저 칭찬하기','낮에 햇볕 15분 쬐기','빨강·주황 포인트 아이템 쓰기'],
        color:'빨강·주황', dir:'남쪽'},
  earth:{bubble:'이것도 저것도…<br>갈팡질팡해요', mood:'surprised',
        desc:'중심을 잡고 꾸준히 이어 가는 힘이<br>약하게 느껴질 수 있어요.',
        tips:['매일 같은 시간에 자고 일어나기','화분 흙 만지기, 산책·등산 하기','베이지·노랑 계열 옷 입기'],
        color:'노랑·베이지', dir:'중앙'},
  metal:{bubble:'거절을<br>못 하겠어요…', mood:'worry',
        desc:'맺고 끊는 결단력이 약해<br>이리저리 끌려다닐 수 있어요.',
        tips:['할 일마다 마감 시간 정하기','안 쓰는 물건 정리하고 비우기','흰색·은색, 금속 액세서리 하기'],
        color:'흰색·은색', dir:'서쪽'},
  water:{bubble:'쉬는 법을<br>모르겠어요', mood:'worry',
        desc:'유연하게 흘려보내고 쉬어 가는 힘이<br>약할 수 있어요.',
        tips:['물을 자주 마시기','자기 전 일기로 생각 정리하기','검정·남색 아이템, 물가 산책'],
        color:'검정·남색', dir:'북쪽'},
};

function elementPage(key){
  const e = EL[key], d = ELPAGE[key];
  return `<div class="page" style="--el:${e.c}">
    <div class="kicker">없는 오행 채우기</div>
    <div class="title"><span class="acc">${e.h}(${e.k})</span>이 없다면</div>
    <div class="cat" style="left:70px;top:265px">${cat({mood:d.mood, prop:key, size:370})}</div>
    <div class="bubble left" style="left:480px;top:320px;width:510px;--ty:60%">${d.bubble}</div>
    <div style="position:absolute;left:80px;right:80px;top:650px;display:flex;flex-direction:column;gap:22px">
      <div class="card" style="padding-top:28px;padding-bottom:28px">
        <span class="lbl">이럴 수 있어요</span>
        <p class="desc">${d.desc}</p>
      </div>
      <div class="card" style="padding-top:28px;padding-bottom:14px">
        <span class="lbl">이렇게 채워요</span>
        <ul class="tips">${d.tips.map((t,i)=>`<li><span class="num">${i+1}</span>${t}</li>`).join('')}</ul>
      </div>
    </div>
    ${brand}
  </div>`;
}

const PAGES = {
  1: () => `<div class="page">
    <div class="kicker">명이의 명리 생활</div>
    <div class="title" style="font-size:96px;margin-top:30px">사주에 없는 오행,<br><span class="acc" style="color:var(--gold)">이렇게 채워요</span></div>
    <p style="text-align:center;font-size:38px;color:var(--sub);margin-top:30px">부족한 기운, 생활 속에서 채우는 법</p>
    <div style="margin-top:56px">${chips()}</div>
    <div class="bubble down" style="left:560px;top:760px;width:420px;--tx:22%">내 사주에<br>水가 없다고?!</div>
    <div class="cat" style="left:130px;top:770px">${cat({mood:'surprised', size:450})}</div>
    ${brand}
  </div>`,
  2: () => `<div class="page">
    <div class="kicker">먼저 알아 두기</div>
    <div class="title">오행이 뭐냐면요</div>
    <div class="card" style="margin-top:50px;text-align:center">
      <p style="font-size:38px;line-height:1.5;margin-bottom:30px">사주 여덟 글자는 다섯 가지 기운,<br><b style="font-family:Jua;font-weight:400;color:var(--navy)">오행</b>으로 이루어져 있어요.</p>
      ${chips()}
    </div>
    <div class="cat" style="left:40px;top:770px">${cat({mood:'normal', size:430})}</div>
    <div class="bubble left" style="left:490px;top:780px;width:500px;--ty:55%">그런데 이 중 하나가<br>아예 없을 수도<br>있대요!</div>
    <div class="card" style="position:absolute;left:470px;right:80px;top:1060px;padding:26px 32px">
      <p style="font-size:32px;line-height:1.5;word-break:keep-all">없다고 나쁜 건 아니에요.<br>생활 속 색과 습관으로<br>살짝 채워 주면 돼요.</p>
    </div>
    ${brand}
  </div>`,
  3: () => elementPage('wood'),
  4: () => elementPage('fire'),
  5: () => elementPage('earth'),
  6: () => elementPage('metal'),
  7: () => elementPage('water'),
  8: () => `<div class="page">
    <div class="kicker">마지막으로</div>
    <div class="title">내 사주엔<br><span class="acc" style="color:var(--gold)">뭐가 없을까?</span></div>
    <div class="cat" style="left:300px;top:420px">${cat({mood:'happy', wave:true, size:480})}</div>
    <div class="card" style="position:absolute;left:80px;right:80px;top:930px;text-align:center">
      <p style="font-size:38px;line-height:1.55;word-break:keep-all">생년월일만 넣으면<br>내 오행 분포를 <b style="font-family:Jua;font-weight:400;color:var(--navy)">무료로</b> 볼 수 있어요</p>
      <p style="font-family:Jua;font-size:40px;color:var(--gold);margin-top:16px">프로필 링크 → 천명연구소 사주 보기</p>
    </div>
    <p style="position:absolute;left:0;right:0;top:1200px;text-align:center;font-size:32px;color:var(--sub)">저장해 두고 하나씩 해 봐요 · 없는 오행을 댓글로 알려 주세요</p>
    ${brand}
  </div>`,
};

const p = +(new URLSearchParams(location.search).get('p') || 1);
document.getElementById('root').innerHTML = PAGES[p]();
</script>
</body>
</html>
